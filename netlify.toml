# Netlify configuration — kayearnold-portfolio
#
# The site is plain static HTML/CSS/JS served from the repository root.
# The only server-side code is the portfolio-assistant function in
# netlify/functions/chat.mjs, exposed at POST /api/chat.
#
# Secrets are NOT stored here. Set them in the Netlify UI:
#   Site configuration → Environment variables
#     GEMINI_API_KEY   (required)
#     GEMINI_MODEL     (optional)

[build]
  base = "."
  publish = "."

[functions]
  directory = "netlify/functions"

# Keep the function source directory from being served as static content.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true